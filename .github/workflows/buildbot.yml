name: buildbot

# Cleanup bot (CI/build.sh, same scripts as E2iPlayer): chmod, dos2unix and
# autopep8 on main, each step committed and pushed back by github-actions.
# Pushes made with the workflow token do not start workflows again.

on:
  push:
    branches: [ main ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build python CI
        run: |
          sudo apt-get -q update
          sudo apt-get install -y dos2unix
          pip install --upgrade pip autopep8
          ./CI/build.sh
