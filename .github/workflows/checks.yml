name: checks

# Syntax on every Python the plugin runs on (2.7 for older images, 3.x for
# current ones), a ruff gate for runtime errors (ruff.toml) and the logic
# test in tests/ with stubbed enigma2 modules for HD, FHD and WQHD.
# A pull request from a branch of this repository runs nothing extra: the push
# to that branch is checked already (the "if" of every job).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile, Python ${{ matrix.python }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Compile
        run: python -m compileall -q .

  test:
    name: Logic test, Python ${{ matrix.python }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Pillow (image size checks)
        run: python -m pip install --quiet Pillow

  python27:
    name: Compile + logic test, Python 2.7
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # setup-python no longer ships 2.7, so run it in the official image
      - name: Compile
        run: docker run --rm -v "$PWD":/src -w /src python:2.7-slim python -m compileall -q .

  ruff:
    name: Ruff (runtime errors)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ruff
        run: python -m pip install --quiet ruff

      - name: Ruff
        run: ruff check . --output-format=github

  packages:
    name: Packages (ipk / deb / zip)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python CI/build_packages.py --out dist

      - name: Check with dpkg
        run: |
          set -e
          for p in dist/*.deb dist/*.ipk; do
            echo "== $p"
            dpkg-deb --info "$p"
            dpkg-deb --contents "$p" | grep -q 'NewVirtualKeyBoard/VirtualKeyBoard.py'
            dpkg-deb --contents "$p" | grep -q 'LC_MESSAGES/NewVirtualKeyBoard.mo'
            # ("! cmd" does not stop a "set -e" script)
            if dpkg-deb --contents "$p" | grep -q '\.po$'; then
              echo "::error::$p contains .po files"
              exit 1
            fi
          done
          (cd dist && sha256sum -c SHA256SUMS)

      # test packages of every push, downloadable from the run's summary page
      - uses: actions/upload-artifact@v4
        with:
          name: NewVirtualKeyBoard-packages
          path: dist/
          retention-days: 14
